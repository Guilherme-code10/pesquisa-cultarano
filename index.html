<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Cultural</title>
</head>
<body>
    <header>
        <h1>Pesquisa online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                 <!-- DADOS PESSOAIS -->

                    <legend>Dados pessoais</legend>
                    <label for="userName">Nome</label>    
                    <input type="text" name="userName" placeholder="Digite seu nome" required>
                    <br>
                    <label for="age">Idade</label>
                    <input type="number" name="userage" min="12" max="100" required>
                    <br>
                    <label for="birthDate">Data de nascimento</label>
                    <input type="date" name="birthDate" >
                    <br>
                    <label for="userEmail">Email</label>
                    <input type="email" name="userEmail" placeholder="Digite seu email" required>
                    <br>
                    <label for="userPhoneNumber">Telefone</label>
                    <input type="tel" name="userPhone" placeholder="DDD + Número sem espaços" pattern="[0-9]{11}">
                    <br>
                    <label for="userImage">Upload de foto</label>
                    <input type="file" name="userImage" accept="image/*">
                    <br>            
            </fieldset>

            <button type="submit">Enviar</button>
        </form>

    </section>
    
</body>
</html>
